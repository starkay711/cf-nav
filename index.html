<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的导航</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
  <style>
    /* ==================== CSS Variables ==================== */
    :root {
      --bg: #0f1117;
      --bg2: #1a1d2e;
      --bg3: #232640;
      --card: #1e2133;
      --card-hover: #262a45;
      --border: #2e3258;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent: #6c8ef7;
      --accent2: #a78bfa;
      --accent3: #34d399;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 0.2s cubic-bezier(.4,0,.2,1);
    }
    [data-theme="light"] {
      --bg: #f0f4ff;
      --bg2: #e6ecff;
      --bg3: #dce5ff;
      --card: #ffffff;
      --card-hover: #f5f7ff;
      --border: #d1d9f0;
      --text: #1e2444;
      --text-muted: #64748b;
      --accent: #4f6ef7;
      --accent2: #7c3aed;
      --accent3: #059669;
      --shadow: 0 8px 32px rgba(79,110,247,0.1);
    }

    /* ==================== Reset & Base ==================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    /* ==================== Background ==================== */
    .bg-decoration {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bg-decoration::before, .bg-decoration::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      animation: float 8s ease-in-out infinite;
    }
    .bg-decoration::before {
      width: 600px; height: 600px;
      background: var(--accent);
      top: -200px; left: -100px;
    }
    .bg-decoration::after {
      width: 500px; height: 500px;
      background: var(--accent2);
      bottom: -150px; right: -100px;
      animation-delay: -4s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* ==================== Layout ==================== */
    .container {
      position: relative; z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ==================== Header / Clock ==================== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0 8px;
    }
    .clock-block { text-align: left; }
    .clock {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .date {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    /* ==================== Buttons ==================== */
    .btn-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 1rem;
      transition: all var(--transition);
    }
    .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.1);
    }

    /* ==================== Search ==================== */
    .search-section { margin: 32px 0 36px; }
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px 10px 20px;
      transition: border-color var(--transition), box-shadow var(--transition);
      box-shadow: var(--shadow);
    }
    .search-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,142,247,0.15), var(--shadow);
    }
    .search-engine-toggle {
      display: flex;
      gap: 4px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .engine-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .engine-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-btn {
      margin-left: 10px;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 0.95rem;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .search-btn:hover { transform: scale(1.08); filter: brightness(1.1); }

    /* ==================== Section Title ==================== */
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ==================== Quick Links ==================== */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
      margin-bottom: 36px;
    }
    .quick-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: all var(--transition);
      cursor: pointer;
    }
    .quick-link:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(108,142,247,0.2);
    }
    .quick-link .icon {
      font-size: 1.6rem;
      line-height: 1;
    }
    .quick-link .label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .quick-link:hover .label { color: var(--text); }

    /* ==================== Categories Grid ==================== */
    .categories { display: flex; flex-direction: column; gap: 28px; }
    .category-section { }
    .site-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .site-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: all var(--transition);
      overflow: hidden;
    }
    .site-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108,142,247,0.18);
    }
    .site-card .site-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .site-card .site-icon img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }
    .site-card .site-info { min-width: 0; flex: 1; }
    .site-card .site-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .site-card .site-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* ==================== Edit Modal ==================== */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      place-items: center;
    }
    .modal-overlay.open { display: grid; }
    .modal {
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: min(560px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h2 {
      font-size: 1.1rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color var(--transition);
      margin-bottom: 14px;
      font-family: inherit;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus {
      border-color: var(--accent);
    }
    .modal textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
    .btn-primary {
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary {
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* ==================== Edit mode ==================== */
    .site-card.edit-mode {
      position: relative;
    }
    .site-card .delete-btn {
      display: none;
      position: absolute;
      top: 4px; right: 4px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #ef4444;
      border: none;
      color: #fff;
      font-size: 0.65rem;
      cursor: pointer;
      place-items: center;
      z-index: 2;
    }
    .edit-active .site-card .delete-btn { display: grid; }
    .edit-active .site-card { cursor: pointer; }
    .add-site-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      background: transparent;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all var(--transition);
    }
    .add-site-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(108,142,247,0.06);
    }

    /* ==================== Toast ==================== */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 20px;
      font-size: 0.85rem;
      box-shadow: var(--shadow);
      z-index: 200;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ==================== Scrollbar ==================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ==================== Responsive ==================== */
    @media (max-width: 600px) {
      .site-grid { grid-template-columns: 1fr 1fr; }
      .quick-links { grid-template-columns: repeat(4, 1fr); }
      .clock { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="clock-block">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">加载中...</div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="editToggle" title="编辑模式">✏️</button>
        <button class="btn-icon" id="themeToggle" title="切换主题">🌙</button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-section">
      <div class="search-wrap">
        <div class="search-engine-toggle" id="engineToggle"></div>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="搜索或输入网址..."
          autocomplete="off"
          spellcheck="false"
        />
        <button class="search-btn" id="searchBtn" title="搜索">🔍</button>
      </div>
    </div>

    <!-- Quick Access -->
    <div class="section-label">⚡ 快速访问</div>
    <div class="quick-links" id="quickLinks"></div>

    <!-- Categories -->
    <div class="categories" id="categories"></div>
  </div>

  <!-- Add/Edit Site Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>🔗 <span id="modalTitle">添加网站</span></h2>
      <input type="hidden" id="editIndex" />
      <input type="hidden" id="editCategory" />
      <label>网站名称</label>
      <input type="text" id="siteName" placeholder="例如：GitHub" />
      <label>网址 URL</label>
      <input type="text" id="siteUrl" placeholder="https://github.com" />
      <label>图标（Emoji 或留空自动获取 Favicon）</label>
      <input type="text" id="siteIcon" placeholder="例如：🐱 或留空" />
      <label>简介描述（可选）</label>
      <input type="text" id="siteDesc" placeholder="代码托管平台" />
      <label>所属分类</label>
      <select id="siteCategorySelect"></select>
      <div class="modal-actions">
        <button class="btn-secondary" id="modalCancel">取消</button>
        <button class="btn-primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <!-- Add Category Modal -->
  <div class="modal-overlay" id="catModal">
    <div class="modal">
      <h2>📁 添加分类</h2>
      <label>分类名称</label>
      <input type="text" id="catName" placeholder="例如：开发工具" />
      <label>分类图标 Emoji</label>
      <input type="text" id="catIcon" placeholder="例如：🛠️" />
      <div class="modal-actions">
        <button class="btn-secondary" id="catModalCancel">取消</button>
        <button class="btn-primary" id="catModalSave">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
  // ==================== Default Data ====================
  const DEFAULT_DATA = {
    theme: 'dark',
    searchEngine: 'google',
    engines: [
      { id: 'google',  name: 'Google',  url: 'https://www.google.com/search?q=', icon: '🌐' },
      { id: 'bing',    name: 'Bing',    url: 'https://www.bing.com/search?q=',   icon: '🔷' },
      { id: 'baidu',   name: '百度',    url: 'https://www.baidu.com/s?wd=',      icon: '🅱️' },
    ],
    quickLinks: [
      { name: 'GitHub',     url: 'https://github.com',        icon: '🐱' },
      { name: 'Gmail',      url: 'https://mail.google.com',   icon: '📧' },
      { name: 'YouTube',    url: 'https://youtube.com',       icon: '📺' },
      { name: 'Twitter/X',  url: 'https://x.com',            icon: '🐦' },
      { name: 'Reddit',     url: 'https://reddit.com',        icon: '🤖' },
      { name: '掘金',       url: 'https://juejin.cn',         icon: '💎' },
      { name: '知乎',       url: 'https://zhihu.com',         icon: '🔵' },
      { name: '哔哩哔哩',   url: 'https://bilibili.com',      icon: '📹' },
    ],
    categories: [
      {
        id: 'dev', name: '开发工具', icon: '🛠️',
        sites: [
          { name: 'GitHub',       url: 'https://github.com',              icon: '🐱', desc: '代码托管平台' },
          { name: 'MDN Web Docs', url: 'https://developer.mozilla.org',   icon: '📚', desc: 'Web 参考文档' },
          { name: 'Stack Overflow',url:'https://stackoverflow.com',        icon: '🏷️', desc: '开发者问答社区' },
          { name: 'Vercel',       url: 'https://vercel.com',              icon: '▲', desc: '前端部署平台' },
          { name: 'Cloudflare',   url: 'https://dash.cloudflare.com',     icon: '🌩️', desc: 'CDN & 网络服务' },
          { name: 'Can I use',    url: 'https://caniuse.com',             icon: '✅', desc: '浏览器兼容性查询' },
          { name: 'npm',          url: 'https://npmjs.com',               icon: '📦', desc: 'JavaScript 包管理' },
          { name: 'Regex101',     url: 'https://regex101.com',            icon: '🔤', desc: '正则表达式测试' },
        ]
      },
      {
        id: 'ai', name: 'AI 工具', icon: '🤖',
        sites: [
          { name: 'ChatGPT',      url: 'https://chat.openai.com',         icon: '🤖', desc: 'OpenAI 对话 AI' },
          { name: 'Claude',       url: 'https://claude.ai',               icon: '💬', desc: 'Anthropic AI' },
          { name: 'Gemini',       url: 'https://gemini.google.com',       icon: '✨', desc: 'Google Gemini AI' },
          { name: 'Midjourney',   url: 'https://midjourney.com',          icon: '🎨', desc: 'AI 图像生成' },
          { name: 'Perplexity',   url: 'https://perplexity.ai',           icon: '🔮', desc: 'AI 搜索引擎' },
          { name: 'Hugging Face', url: 'https://huggingface.co',          icon: '🤗', desc: '开源模型平台' },
        ]
      },
      {
        id: 'design', name: '设计资源', icon: '🎨',
        sites: [
          { name: 'Figma',        url: 'https://figma.com',               icon: '🖌️', desc: 'UI 设计工具' },
          { name: 'Dribbble',     url: 'https://dribbble.com',            icon: '🏀', desc: '设计灵感' },
          { name: 'Unsplash',     url: 'https://unsplash.com',            icon: '📷', desc: '免费高清图片' },
          { name: 'Coolors',      url: 'https://coolors.co',              icon: '🎨', desc: '配色方案生成' },
          { name: 'Font Awesome', url: 'https://fontawesome.com',         icon: '🔠', desc: '图标字体库' },
          { name: 'Lucide Icons', url: 'https://lucide.dev',              icon: '💠', desc: '开源图标库' },
        ]
      },
      {
        id: 'news', name: '资讯阅读', icon: '📰',
        sites: [
          { name: 'Hacker News',  url: 'https://news.ycombinator.com',    icon: '🗞️', desc: '科技资讯社区' },
          { name: '少数派',       url: 'https://sspai.com',               icon: '🟠', desc: '数字生活方式' },
          { name: 'V2EX',         url: 'https://v2ex.com',                icon: '🔷', desc: '创意工作者社区' },
          { name: 'Product Hunt', url: 'https://producthunt.com',         icon: '🐱', desc: '新产品发现' },
        ]
      },
    ]
  };

  // ==================== State ====================
  let state = {};
  let isEditMode = false;
  let editingSite = null; // { categoryId, index } or { type: 'quick', index }
  let addingToCategory = null;

  // ==================== Storage ====================
  function loadState() {
    try {
      const saved = localStorage.getItem('nav-state');
      if (saved) state = JSON.parse(saved);
      else state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    } catch {
      state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  }
  function saveState() {
    localStorage.setItem('nav-state', JSON.stringify(state));
  }

  // ==================== Clock ====================
  const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    document.getElementById('date').textContent =
      `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日  ${WEEKDAYS[now.getDay()]}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ==================== Theme ====================
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '☀️' : '🌙';
  }
  document.getElementById('themeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); saveState();
  });

  // ==================== Search Engine ==================== 
  function renderEngines() {
    const wrap = document.getElementById('engineToggle');
    wrap.innerHTML = state.engines.map(e =>
      `<button class="engine-btn ${e.id === state.searchEngine ? 'active' : ''}"
        data-id="${e.id}">${e.name}</button>`
    ).join('');
    wrap.querySelectorAll('.engine-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.searchEngine = btn.dataset.id;
        renderEngines(); saveState();
      });
    });
  }
  function doSearch(q) {
    q = q.trim();
    if (!q) return;
    const engine = state.engines.find(e => e.id === state.searchEngine);
    // detect URL
    if (/^https?:\/\//.test(q) || (/^[\w-]+\.[\w.-]+(\/|$)/.test(q) && !q.includes(' '))) {
      window.location.href = q.startsWith('http') ? q : 'https://' + q;
    } else {
      window.open(engine.url + encodeURIComponent(q), '_blank');
    }
  }
  document.getElementById('searchBtn').addEventListener('click', () => {
    doSearch(document.getElementById('searchInput').value);
  });
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch(e.target.value);
  });

  // ==================== Favicon Helper ====================
  function getFaviconUrl(url) {
    try {
      const hostname = new URL(url).hostname;
      return `https://favicon.im/${hostname}?larger=true`;
    } catch { return ''; }
  }
  function siteIconHtml(site) {
    if (site.icon && site.icon.trim()) {
      return `<div class="site-icon">${site.icon}</div>`;
    }
    const fav = getFaviconUrl(site.url);
    return `<div class="site-icon"><img src="${fav}" loading="lazy"
      onerror="this.parentElement.textContent='🔗'" alt="" /></div>`;
  }

  // ==================== Quick Links ====================
  function renderQuickLinks() {
    const el = document.getElementById('quickLinks');
    el.innerHTML = state.quickLinks.map((q, i) =>
      `<a class="quick-link" href="${q.url}" target="_blank" rel="noopener" data-qi="${i}">
        <div class="icon">${q.icon || '🔗'}</div>
        <div class="label">${q.name}</div>
        <button class="delete-btn" data-qi="${i}" onclick="deleteQuick(event,${i})">✕</button>
      </a>`
    ).join('');
    if (isEditMode) {
      const addBtn = document.createElement('button');
      addBtn.className = 'quick-link';
      addBtn.style.border = '1.5px dashed var(--border)';
      addBtn.innerHTML = '<div class="icon" style="color:var(--text-muted)">➕</div><div class="label" style="color:var(--text-muted)">添加</div>';
      addBtn.addEventListener('click', () => openAddSiteModal(null, true));
      el.appendChild(addBtn);
    }
  }
  window.deleteQuick = function(e, i) {
    e.preventDefault(); e.stopPropagation();
    state.quickLinks.splice(i, 1);
    saveState(); renderQuickLinks();
    toast('已删除快速访问');
  };

  // ==================== Categories ====================
  function renderCategories() {
    const el = document.getElementById('categories');
    el.innerHTML = '';
    state.categories.forEach(cat => {
      const section = document.createElement('div');
      section.className = 'category-section';
      section.dataset.catId = cat.id;
      const label = document.createElement('div');
      label.className = 'section-label';
      label.innerHTML = `${cat.icon} ${cat.name}`;
      if (isEditMode) {
        const delCatBtn = document.createElement('button');
        delCatBtn.className = 'btn-icon';
        delCatBtn.style.cssText = 'width:22px;height:22px;font-size:0.65rem;border-color:#ef4444;color:#ef4444;flex-shrink:0;';
        delCatBtn.title = '删除分类';
        delCatBtn.textContent = '✕';
        delCatBtn.addEventListener('click', () => deleteCategory(cat.id));
        label.appendChild(delCatBtn);
      }
      const grid = document.createElement('div');
      grid.className = 'site-grid';
      cat.sites.forEach((site, i) => {
        const card = document.createElement('a');
        card.className = 'site-card' + (isEditMode ? ' edit-mode' : '');
        card.href = site.url;
        card.target = '_blank';
        card.rel = 'noopener';
        card.innerHTML = `
          ${siteIconHtml(site)}
          <div class="site-info">
            <div class="site-name">${site.name}</div>
            ${site.desc ? `<div class="site-desc">${site.desc}</div>` : ''}
          </div>
          <button class="delete-btn" onclick="deleteSite(event,'${cat.id}',${i})">✕</button>
        `;
        if (isEditMode) {
          card.addEventListener('click', e => {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            openEditSiteModal(cat.id, i);
          });
        }
        grid.appendChild(card);
      });
      if (isEditMode) {
        const addBtn = document.createElement('button');
        addBtn.className = 'add-site-btn';
        addBtn.innerHTML = '➕ 添加网站';
        addBtn.addEventListener('click', () => openAddSiteModal(cat.id));
        grid.appendChild(addBtn);
      }
      section.appendChild(label);
      section.appendChild(grid);
      el.appendChild(section);
    });

    if (isEditMode) {
      const addCatBtn = document.createElement('button');
      addCatBtn.className = 'add-site-btn';
      addCatBtn.style.cssText = 'width:100%;justify-content:center;padding:18px;';
      addCatBtn.innerHTML = '📁 添加新分类';
      addCatBtn.addEventListener('click', () => openCatModal());
      el.appendChild(addCatBtn);
    }
  }

  window.deleteSite = function(e, catId, i) {
    e.preventDefault(); e.stopPropagation();
    const cat = state.categories.find(c => c.id === catId);
    if (cat) { cat.sites.splice(i, 1); saveState(); renderCategories(); toast('已删除网站'); }
  };

  function deleteCategory(catId) {
    if (!confirm('确认删除该分类？')) return;
    state.categories = state.categories.filter(c => c.id !== catId);
    saveState(); renderCategories(); toast('已删除分类');
  }

  // ==================== Edit Mode ====================
  document.getElementById('editToggle').addEventListener('click', () => {
    isEditMode = !isEditMode;
    document.getElementById('editToggle').textContent = isEditMode ? '✅' : '✏️';
    document.getElementById('editToggle').title = isEditMode ? '完成编辑' : '编辑模式';
    document.body.classList.toggle('edit-active', isEditMode);
    renderQuickLinks();
    renderCategories();
    if (!isEditMode) toast('修改已保存 ✓');
  });

  // ==================== Modal: Add/Edit Site ====================
  function populateCategorySelect(selectedId) {
    const sel = document.getElementById('siteCategorySelect');
    sel.innerHTML = '<option value="__quick">⚡ 快速访问</option>' +
      state.categories.map(c => `<option value="${c.id}" ${c.id===selectedId?'selected':''}>${c.icon} ${c.name}</option>`).join('');
    if (selectedId === '__quick') sel.value = '__quick';
  }

  function openAddSiteModal(catId, isQuick) {
    addingToCategory = isQuick ? '__quick' : catId;
    editingSite = null;
    document.getElementById('modalTitle').textContent = '添加网站';
    document.getElementById('siteName').value = '';
    document.getElementById('siteUrl').value = '';
    document.getElementById('siteIcon').value = '';
    document.getElementById('siteDesc').value = '';
    populateCategorySelect(addingToCategory);
    document.getElementById('modal').classList.add('open');
    document.getElementById('siteName').focus();
  }

  function openEditSiteModal(catId, idx) {
    const cat = state.categories.find(c => c.id === catId);
    const site = cat.sites[idx];
    editingSite = { catId, idx };
    document.getElementById('modalTitle').textContent = '编辑网站';
    document.getElementById('siteName').value = site.name;
    document.getElementById('siteUrl').value = site.url;
    document.getElementById('siteIcon').value = site.icon || '';
    document.getElementById('siteDesc').value = site.desc || '';
    populateCategorySelect(catId);
    document.getElementById('modal').classList.add('open');
    document.getElementById('siteName').focus();
  }

  document.getElementById('modalCancel').addEventListener('click', () => {
    document.getElementById('modal').classList.remove('open');
  });
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal'))
      document.getElementById('modal').classList.remove('open');
  });

  document.getElementById('modalSave').addEventListener('click', () => {
    const name = document.getElementById('siteName').value.trim();
    const url  = document.getElementById('siteUrl').value.trim();
    const icon = document.getElementById('siteIcon').value.trim();
    const desc = document.getElementById('siteDesc').value.trim();
    const catSel = document.getElementById('siteCategorySelect').value;
    if (!name || !url) { toast('⚠️ 名称和网址不能为空'); return; }
    const fullUrl = url.startsWith('http') ? url : 'https://' + url;
    const entry = { name, url: fullUrl, icon, desc };

    if (editingSite) {
      // edit existing
      const cat = state.categories.find(c => c.id === editingSite.catId);
      if (catSel === editingSite.catId) {
        cat.sites[editingSite.idx] = entry;
      } else {
        cat.sites.splice(editingSite.idx, 1);
        if (catSel === '__quick') state.quickLinks.push({ name, url: fullUrl, icon: icon||'🔗' });
        else state.categories.find(c=>c.id===catSel)?.sites.push(entry);
      }
    } else {
      // add new
      if (catSel === '__quick') state.quickLinks.push({ name, url: fullUrl, icon: icon||'🔗' });
      else state.categories.find(c=>c.id===catSel)?.sites.push(entry);
    }
    saveState();
    renderQuickLinks();
    renderCategories();
    document.getElementById('modal').classList.remove('open');
    toast('✓ 保存成功');
  });

  // ==================== Modal: Category ====================
  function openCatModal() {
    document.getElementById('catName').value = '';
    document.getElementById('catIcon').value = '';
    document.getElementById('catModal').classList.add('open');
    document.getElementById('catName').focus();
  }
  document.getElementById('catModalCancel').addEventListener('click', () => {
    document.getElementById('catModal').classList.remove('open');
  });
  document.getElementById('catModal').addEventListener('click', e => {
    if (e.target === document.getElementById('catModal'))
      document.getElementById('catModal').classList.remove('open');
  });
  document.getElementById('catModalSave').addEventListener('click', () => {
    const name = document.getElementById('catName').value.trim();
    const icon = document.getElementById('catIcon').value.trim() || '📁';
    if (!name) { toast('⚠️ 请输入分类名称'); return; }
    const id = 'cat_' + Date.now();
    state.categories.push({ id, name, icon, sites: [] });
    saveState(); renderCategories();
    document.getElementById('catModal').classList.remove('open');
    toast('✓ 分类已添加');
  });

  // ==================== Toast ====================
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ==================== Keyboard Shortcut ====================
  document.addEventListener('keydown', e => {
    // Ctrl+K / Cmd+K or / to focus search
    if ((e.ctrlKey && e.key === 'k') || (e.metaKey && e.key === 'k')) {
      e.preventDefault();
      document.getElementById('searchInput').focus();
      document.getElementById('searchInput').select();
    }
  });

  // ==================== Init ====================
  loadState();
  applyTheme();
  renderEngines();
  renderQuickLinks();
  renderCategories();
  // Auto focus search on load
  window.addEventListener('load', () => {
    document.getElementById('searchInput').focus();
  });
  </script>
</body>
</html>
